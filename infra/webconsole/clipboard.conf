# clipboard.conf — alternate, drop-in-only way to add the clipboard-shim -I/--index flag
# onto an ALREADY-DEPLOYED claude-web-term.service you don't want to hand-edit. Install
# ONE of the two mechanisms this directory ships, not both: claude-web-term.service.
# template already bakes the equivalent -I flag straight into its own ExecStart=, so
# layering this drop-in on top of THAT template just re-declares an identical command
# line. This file exists because that's exactly how the reference deployment actually
# shipped it — `systemctl cat claude-web-term` on that box showed a real
# claude-web-term.service.d/clipboard.conf doing this same ExecStart= override — kept
# here as a documented, working alternative for retrofitting an existing unit instead of
# replacing it outright. See claude-web-term.service.template's own header for the full
# explanation of what -I's target actually is (and isn't) in this deployment.
#
# Install:
#   mkdir -p /etc/systemd/system/claude-web-term.service.d
#   install -m 0644 this-file /etc/systemd/system/claude-web-term.service.d/clipboard.conf
#   systemctl daemon-reload && systemctl restart claude-web-term
#
# No `-t titleFixed=...` here, same as the template: it would pin the browser-tab title
# and make the client ignore the per-session titles tmux set-titles emits (see the
# template's header note).
#
# `-t rendererType=canvas` turns OFF ttyd's default WebGL renderer, on purpose. Backgrounding
# the iOS PWA loses the GPU context, and ttyd 1.7.4 cannot come back from that: its
# onContextLoss handler calls `webglAddon.dispose()` but never clears `this.webglAddon`,
# while the re-enable path is guarded by `if(!this.webglAddon)` — so WebGL is gone for the
# rest of that page load. What you see on the phone is a garbled screen (rows drawn against
# a stale glyph atlas) decaying into a blank one where only background rectangles paint —
# tmux's green status bar with no text in it was the giveaway. Not recoverable from JS
# either: clearTextureAtlas() on a dead context is a no-op, which is why the ccpaint repaint
# block alone wasn't enough. The canvas renderer has no context to lose, and a purged canvas
# IS recoverable by a repaint, which ccpaint already does on foreground. Upgrade path is one
# word: rendererType=webgl restores the old behaviour, =dom drops canvas too (slowest).
#
# --index points at the GENERATED page (infra/webconsole/make-term-index.sh output), not at
# clipboard-shim.html: the shim is spliced into that page already, along with every mobile
# block. This is what the reference deployment runs. The .service.template still bootstraps
# from the bare shim, since term-index.html does not exist until you generate it.
[Service]
ExecStart=
ExecStart=/usr/bin/ttyd --port 7681 --interface 127.0.0.1 --base-path /term --writable --url-arg -t fontSize=14 -t rendererType=canvas --index /opt/claude-dashboard/term-index.html /opt/claude-dashboard/web-term.sh
