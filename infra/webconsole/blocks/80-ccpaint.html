<script id="ccpaint-js">/*ccpaint-v7: the screen not repainting after the phone comes back to a
live session -- historically garbled rows, then a blank grid, cleared by any tap.
Renderer: WebGL is off at the unit (`-t rendererType=canvas`). ttyd 1.7.4 cannot recover a
lost WebGL context -- its onContextLoss disposes the addon but never clears the reference and
the re-enable path is `if(!this.webglAddon)` -- and a lost context is unfixable from JS, so on
WebGL this block was powerless: first fused words from a stale glyph atlas, then background
rectangles with no text at all (a green tmux bar with nothing in it).
Trigger: NOT visibility events. Locking an iPhone screen in a standalone PWA fires no
visibilitychange, pageshow or focus, yet still freezes the page -- the same iOS gap
50-ccime.html works around for its reconnect kick -- so v1 never ran on the path that kept
reproducing. v2 added two event-free triggers, kept below: a 1s timer that returns late (the
page was frozen), and a new websocket (ttyd kills the child process on socket close and starts
a fresh one on reconnect, so a new socket proves we were away).
Repaint: clearTextureAtlas() + refresh() alone is NOT a full repaint. The canvas renderer
caches what it has already drawn per cell and skips cells it believes are unchanged, so rows
left stale by a purged backing store stay stale. _renderService.clear() drops that cache (and
the layers) so the following refresh really redraws every cell from the buffer. Measured on
the live page: 9691 glyph pixels -> 8 after clear() -> 9691 after refresh, exact.
v3 also REMOVES v2's `dispatchEvent(new Event('resize'))` belt, which backfired. It was meant
to make the app redraw via SIGWINCH, but on a stable viewport fit() changes nothing and the
dispatch contributes no repaint at all, while on a phone -- where the PWA geometry, keyboard
and URL bar move -- it lands on a different row count and DOES resize the pty. The visible
result was ~50 crisp copies of one line: not a render artifact (every glyph was sharp) but a
redraw trail from resizing the terminal under a running TUI. Repainting is the renderer's job;
never touch the pty to do it.
Kill switch: /term/?paint=off   Self-check: /term/?paintdbg=1 logs every repaint + its trigger.
ponytail: _core._renderService is private xterm API, wrapped in try/catch with the public
clearTextureAtlas/refresh still running if it ever disappears; the public surface has no
"invalidate what you think you drew", so this is the only honest full repaint.*/(function(){
if(/[?&]paint=off\b/.test(location.search))return;
var dbg=/[?&]paintdbg=1\b/.test(location.search),n=0;
function repaint(why){var t=window.term;if(!t)return;
 /*synchronous: clear blanks the layers, so never yield to a paint between clear and refresh*/
 try{t._core._renderService.clear()}catch(e){}/*drops the per-cell "already drawn" cache*/
 try{t.clearTextureAtlas&&t.clearTextureAtlas()}catch(e){}
 try{t.refresh(0,t.rows-1)}catch(e){}
 if(dbg)console.log('[ccpaint] repaint',++n,why)}
function resume(why){requestAnimationFrame(function(){repaint(why)});
 setTimeout(function(){repaint(why+'/late')},300);/*rAF can beat the canvas actually coming back*/
 var k=window.__ccimeKick;if(k)setTimeout(k,400)}/*v4: socket died during screen lock -> blank
 page, and no event fires on iOS unlock; the freeze detector lands here, so reconnect here.
 kick() checks readyState itself -- a healthy socket makes this a no-op*/
/*v7 -- THE ROOT CAUSE, from the repro's own console: rapid resize during active output
races xterm's parser -- InputHandler.print writes to a buffer row the resize just deleted,
"Cannot set properties of undefined (setting 'isWrapped')" rips through WriteBuffer._innerWrite
and the loop is never rescheduled: bytes arrive forever, parsed never. Every symptom of the
last two days (fused rows, tiled frames, blank grid, all cured by a tap = xterm's user-input
loop restart) is that one dead loop. Why only recently: the mobile-UX head made the iOS
keyboard RESIZE the page and PWA geometry settle in steps, so phones now churn 4-6 sizes per
resume where the old page had none -- the latent race never fired before.
Fix at the entry: coalesce resize bursts (150ms) and apply only when the write queue is
drained, so the parser is never mid-stream when the buffer changes shape. The unjam watchdog
below stays as the belt for anything else that ever kills the loop.*/
(function(){var iv2=setInterval(function(){var t=window.term;if(!t)return;clearInterval(iv2);
 var orig=t.resize.bind(t),rq=null,timer=null;
 t.resize=function(c,r){rq=[c,r];clearTimeout(timer);timer=setTimeout(apply,150)};
 function apply(){if(!rq)return;
  var wb=null;try{wb=t._core._writeBuffer}catch(e){}
  if(wb&&wb._pendingData>0){setTimeout(apply,50);return}/*mid-parse: wait for drain (the
   watchdog unjams a dead loop, so this cannot wait forever)*/
  var q=rq;rq=null;try{orig(q[0],q[1])}catch(e){}
  if(dbg)console.log('[ccpaint] resize applied',q[0]+'x'+q[1])}},250)})();
/*v8: lost first frame on a FRESH load — F5 on an attach tab gave a themed background
with a cursor at 0,0 and nothing else, while server-side the tmux client had attached at
220x60 and drawn a full screen (2026-08-25, not reproducible in 15 staged loads — a
client-side race somewhere between ws-open and first paint). Every healer above fires on
RESUME events only, so a fresh load had none. Detector: tmux always paints at least its
status bar on attach, so a buffer with zero non-empty lines seconds after load means the
frame was LOST, not "nothing to show". Ladder, each rung only if still empty: repaint
(free), reconnect kick (no-op on a healthy socket), one full reload — capped at 2 per tab
via sessionStorage so it can never loop.*/
/*v8.1 diag: a real user's tabs go blank on every load while 15+ staged runs paint —
the failure only exists in the field, so the page phones home its own boot stages
through the /z access-log sink (same channel as ccpwa's geometry beacon; a handful of
beacons per load, plain query strings, no bodies). Read them:
jq 'select(.request.uri|test("t=termdiag"))' the Caddy log. Remove once solved.*/
var diag=(function(){var boot=Math.floor(performance.now());
 function send(e,d){try{var u='/z?t=termdiag&e='+e+'&d='+encodeURIComponent(String(d).slice(0,120))+'&ms='+Math.floor(performance.now());
  navigator.sendBeacon?navigator.sendBeacon(u):fetch(u,{keepalive:true})}catch(x){}}
 window.addEventListener('error',function(ev){send('jserr',(ev.message||'?')+' @'+(ev.filename||'').split('/').pop()+':'+ev.lineno)});
 window.addEventListener('unhandledrejection',function(ev){send('reject',ev.reason)});
 var OW=window.WebSocket,n=0;
 window.WebSocket=function(u,pr){var ws=pr!==undefined?new OW(u,pr):new OW(u),id=++n,bytes=0,first=false;
  if(String(u).indexOf('/ws')>=0){send('ws-new',id+':'+String(u).slice(-40));
   ws.addEventListener('open',function(){send('ws-open',id)});
   ws.addEventListener('close',function(ev){send('ws-close',id+':'+ev.code)});
   ws.addEventListener('error',function(){send('ws-err',id)});
   ws.addEventListener('message',function(m){
    bytes+=(m.data&&(m.data.byteLength||m.data.length))||0;
    if(!first){first=true;send('ws-first-msg',id+':'+bytes+'B')}});
   setTimeout(function(){send('ws-5s',id+':'+bytes+'B rs'+ws.readyState)},5000)}
  return ws};
 window.WebSocket.prototype=OW.prototype;
 ['CONNECTING','OPEN','CLOSING','CLOSED'].forEach(function(k){window.WebSocket[k]=OW[k]});
 [3000,9000].forEach(function(ms){setTimeout(function(){
  var t=window.term,ln=-1;try{var b=t.buffer.active;ln=0;
   for(var i=0;i<b.length;i++){var l=b.getLine(i);if(l&&l.translateToString(true).trim())ln++}}catch(e){}
  send('buf'+ms,ln+'L')},ms)});
 return send})();
function bufEmpty(){try{var b=window.term.buffer.active;
 for(var i=0;i<b.length;i++){var l=b.getLine(i);if(l&&l.translateToString(true).trim())return false}
 return true}catch(e){return false}}
[4000,8000,15000].forEach(function(ms,step){setTimeout(function(){
 if(!window.term)return;
 if(!bufEmpty()){if(step===0){try{sessionStorage.removeItem('ccpaint-r')}catch(e){}}return}
 if(dbg)console.log('[ccpaint] buffer empty at '+ms+'ms, rung '+step);
 if(step===0){repaint('settle-empty');return}
 if(step===1){var k=window.__ccimeKick;if(k){k();return}}
 try{var n=+(sessionStorage.getItem('ccpaint-r')||0);
  if(n<2){sessionStorage.setItem('ccpaint-r',n+1);location.reload()}}catch(e){}
},ms)});
['visibilitychange','pageshow','focus'].forEach(function(ty){
 (ty==='visibilitychange'?document:window).addEventListener(ty,function(){
  if(document.visibilityState!=='visible')return;resume(ty)})});
/*fires on the canvas and does not bubble -- capture on document*/
document.addEventListener('webglcontextrestored',function(){resume('ctxrestored')},true);
var last=Date.now(),ws=null,first=true,pd0=-1,stuck=0,hadContent=false;
setInterval(function(){
 /*v9 -- from the field beacons (2026-08-25, termdiag): on a slow real-world connect the
 ws takes ~4.5s to OPEN, data then lands fine (38 buffer lines by 10s) yet the glyph
 layer never paints -- full buffer, blank screen, live cursor. Same dead-atlas family the
 header documents, but on a FRESH load no resume event ever runs the cure, and v8's
 fixed-clock rungs fired before the socket had even opened. The right moment is the
 buffer's empty->content transition: repaint right then (and once more for luck).*/
 if(!hadContent&&window.term&&!bufEmpty()){hadContent=true;
  repaint('first-content');setTimeout(function(){repaint('first-content/late')},1000)}
 /*v6 -- THE actual bug, reproduced deterministically 2026-08-23 by replaying the phone's own
 resize churn (53x47->49x47->49x49->59x55->59x32->59x55, from webterm-hook.log) against a live
 ttyd: the churn kills xterm's WriteBuffer processing loop mid-stream. Bytes keep ARRIVING but
 are never parsed -- caught with 408 chunks / ~700KB queued in _writeBuffer while tmux's model
 ticked on cleanly -- so the grid freezes on whatever half-frame was painted when the loop
 died: rows fused at stale widths, empty bottom rows, or plain blank. Every earlier fix
 repainted some buffer's own copy of that stale frame; none touched the queue. A tap always
 fixed it because user input restarts the loop (xterm's own _didUserInput path). This watchdog
 is that tap: pending bytes with zero progress across 2 ticks means the loop is dead (a live
 one drains 700KB in ms) -- restart it. One private API (_writeBuffer), wrapped in try/catch.*/
 try{var wb=window.term&&window.term._core._writeBuffer;
  if(wb&&typeof wb._pendingData==='number'){var pd=wb._pendingData;
   /*a healthy queue sampled at 1Hz is empty -- parsing drains hundreds of KB per tick, so
   nonzero AND non-decreasing on consecutive ticks means the loop is dead, not busy (with a
   live producer like tmux the jammed queue GROWS, which is why an equality check missed it)*/
   if(pd>0&&pd0>0&&pd>=pd0){if(++stuck>=2){try{wb._innerWrite()}catch(e){}
    if(dbg)console.log('[ccpaint] unjam',pd+'B');stuck=0}}
   else stuck=0;
   pd0=pd}}catch(e){}
 var now=Date.now();
 if(now-last>2500)resume('frozen-'+(now-last)+'ms');/*screen lock: no event, but time moved*/
 last=now;
 var f=window.__ccimeWS,w=f&&f();/*exported by 50-ccime.html; absent on desktop and ?ime=off*/
 if(!w||w===ws)return;
 ws=w;
 if(first){first=false;return}/*the page's own first socket is not a reconnect*/
 if(w.readyState===1)resume('ws-new');
 else w.addEventListener('open',function(){resume('ws-open')})
},1000);
})()</script>
