<style id="cctheme-css">
#cckb select#ccthemesel{flex:0 0 auto;height:36px;max-width:132px;background:#21262d;color:#e6edf3;
border:1px solid #30363d;border-radius:6px;font:13px ui-monospace,monospace;padding:0 8px;
-webkit-appearance:none;appearance:none}
</style>
<script id="cctheme-js">/*cctheme-v1: switchable xterm color themes. 12 schemes converted from
mbadolato/iTerm2-Color-Schemes (MIT) windowsterminal ports — key renames: purple->magenta,
brightPurple->brightMagenta, cursorColor->cursor. Picker lives in the #cckb key bar (mobile);
on desktop the bar is hidden, so set it once via URL (?theme=Nord, ?theme=default to reset)
or console (cctheme("Nord")) — the choice persists per browser in localStorage ("cctheme").
canonical source is infra/webconsole/themes.json — keep in sync.
"Auto (global)" = follows dashboard global (/settings/term-theme.json), or ttyd default when unset,
captured live at init, so there is always a way back. Kill switch: ?theme=off.
Guardian interval re-asserts the effective theme if a reconnect/preference push restores
ttyd defaults (same pattern, same reason as ccfont).*/(function(){
  var q=new URLSearchParams(location.search).get("theme");
  if(q==="off")return;
  var THEMES={Material:{black:"#212121",red:"#b7141f",green:"#457b24",yellow:"#f6981e",blue:"#134eb2",magenta:"#560088",cyan:"#0e717c",white:"#afafaf",brightBlack:"#424242",brightRed:"#e83b3f",brightGreen:"#7aba3a",brightYellow:"#bfaa00",brightBlue:"#54a4f3",brightMagenta:"#aa4dbc",brightCyan:"#26bbd1",brightWhite:"#d9d9d9",background:"#eaeaea",foreground:"#232322",cursor:"#16afca",selectionBackground:"#c2c2c2"},"Material Dark":{black:"#212121",red:"#b7141f",green:"#457b24",yellow:"#f6981e",blue:"#134eb2",magenta:"#701aa2",cyan:"#0e717c",white:"#efefef",brightBlack:"#4f4f4f",brightRed:"#e83b3f",brightGreen:"#7aba3a",brightYellow:"#ffea2e",brightBlue:"#54a4f3",brightMagenta:"#aa4dbc",brightCyan:"#26bbd1",brightWhite:"#d9d9d9",background:"#232322",foreground:"#e5e5e5",cursor:"#16afca",selectionBackground:"#dfdfdf"},"Material Darker":{black:"#000000",red:"#ff5370",green:"#c3e88d",yellow:"#ffcb6b",blue:"#82aaff",magenta:"#c792ea",cyan:"#89ddff",white:"#ffffff",brightBlack:"#545454",brightRed:"#ff5370",brightGreen:"#c3e88d",brightYellow:"#ffcb6b",brightBlue:"#82aaff",brightMagenta:"#c792ea",brightCyan:"#89ddff",brightWhite:"#ffffff",background:"#212121",foreground:"#eeffff",cursor:"#ffffff",selectionBackground:"#eeffff"},"Material Ocean":{black:"#546e7a",red:"#ff5370",green:"#c3e88d",yellow:"#ffcb6b",blue:"#82aaff",magenta:"#c792ea",cyan:"#89ddff",white:"#ffffff",brightBlack:"#546e7a",brightRed:"#ff5370",brightGreen:"#c3e88d",brightYellow:"#ffcb6b",brightBlue:"#82aaff",brightMagenta:"#c792ea",brightCyan:"#89ddff",brightWhite:"#ffffff",background:"#0f111a",foreground:"#8f93a2",cursor:"#ffcc00",selectionBackground:"#1f2233"},"Material Design Colors":{black:"#435b67",red:"#fc3841",green:"#5cf19e",yellow:"#fed032",blue:"#37b6ff",magenta:"#fc226e",cyan:"#59ffd1",white:"#ffffff",brightBlack:"#a1b0b8",brightRed:"#fc746d",brightGreen:"#adf7be",brightYellow:"#fee16c",brightBlue:"#70cfff",brightMagenta:"#fc669b",brightCyan:"#9affe6",brightWhite:"#ffffff",background:"#1d262a",foreground:"#e7ebed",cursor:"#eaeaea",selectionBackground:"#4e6a78"},"Oceanic Material":{black:"#000000",red:"#ee2b2a",green:"#40a33f",yellow:"#ffea2e",blue:"#1e80f0",magenta:"#8800a0",cyan:"#16afca",white:"#a4a4a4",brightBlack:"#777777",brightRed:"#dc5c60",brightGreen:"#70be71",brightYellow:"#fff163",brightBlue:"#54a4f3",brightMagenta:"#aa4dbc",brightCyan:"#42c7da",brightWhite:"#ffffff",background:"#1c262b",foreground:"#c2c8d7",cursor:"#b3b8c3",selectionBackground:"#6dc2b8"},Nord:{black:"#3b4252",red:"#bf616a",green:"#a3be8c",yellow:"#ebcb8b",blue:"#81a1c1",magenta:"#b48ead",cyan:"#88c0d0",white:"#e5e9f0",brightBlack:"#596377",brightRed:"#bf616a",brightGreen:"#a3be8c",brightYellow:"#ebcb8b",brightBlue:"#81a1c1",brightMagenta:"#b48ead",brightCyan:"#8fbcbb",brightWhite:"#eceff4",background:"#2e3440",foreground:"#d8dee9",cursor:"#eceff4",selectionBackground:"#eceff4"},"Catppuccin Mocha":{black:"#45475a",red:"#f38ba8",green:"#a6e3a1",yellow:"#f9e2af",blue:"#89b4fa",magenta:"#f5c2e7",cyan:"#94e2d5",white:"#bac2de",brightBlack:"#585b70",brightRed:"#f7aec2",brightGreen:"#c2ecbf",brightYellow:"#fcd682",brightBlue:"#aeccfc",brightMagenta:"#f398da",brightCyan:"#b1eae1",brightWhite:"#a6adc8",background:"#1e1e2e",foreground:"#cdd6f4",cursor:"#f5e0dc",selectionBackground:"#f5e0dc"},TokyoNight:{black:"#15161e",red:"#f7768e",green:"#9ece6a",yellow:"#e0af68",blue:"#7aa2f7",magenta:"#bb9af7",cyan:"#7dcfff",white:"#a9b1d6",brightBlack:"#414868",brightRed:"#f7768e",brightGreen:"#9ece6a",brightYellow:"#e0af68",brightBlue:"#7aa2f7",brightMagenta:"#bb9af7",brightCyan:"#7dcfff",brightWhite:"#c0caf5",background:"#1a1b26",foreground:"#c0caf5",cursor:"#c0caf5",selectionBackground:"#33467c"},"Rose Pine":{black:"#26233a",red:"#eb6f92",green:"#31748f",yellow:"#f6c177",blue:"#9ccfd8",magenta:"#c4a7e7",cyan:"#ebbcba",white:"#e0def4",brightBlack:"#6e6a86",brightRed:"#eb6f92",brightGreen:"#31748f",brightYellow:"#f6c177",brightBlue:"#9ccfd8",brightMagenta:"#c4a7e7",brightCyan:"#ebbcba",brightWhite:"#e0def4",background:"#191724",foreground:"#e0def4",cursor:"#e0def4",selectionBackground:"#403d52"},"GitHub Dark":{black:"#484f58",red:"#ff7b72",green:"#3fb950",yellow:"#d29922",blue:"#58a6ff",magenta:"#bc8cff",cyan:"#39c5cf",white:"#b1bac4",brightBlack:"#6e7681",brightRed:"#ffa198",brightGreen:"#56d364",brightYellow:"#e3b341",brightBlue:"#79c0ff",brightMagenta:"#d2a8ff",brightCyan:"#56d4dd",brightWhite:"#ffffff",background:"#0d1117",foreground:"#e6edf3",cursor:"#2f81f7",selectionBackground:"#e6edf3"},"GitHub Light":{black:"#24292f",red:"#cf222e",green:"#116329",yellow:"#4d2d00",blue:"#0969da",magenta:"#8250df",cyan:"#1b7c83",white:"#6e7781",brightBlack:"#57606a",brightRed:"#a40e26",brightGreen:"#1a7f37",brightYellow:"#633c01",brightBlue:"#218bff",brightMagenta:"#a475f9",brightCyan:"#3192aa",brightWhite:"#8c959f",background:"#ffffff",foreground:"#1f2328",cursor:"#0969da",selectionBackground:"#1f2328"}};
  var KEY="cctheme",tries=0;
  var iv=setInterval(function(){
    var T=window.term;
    if(T&&T.options){clearInterval(iv);init(T)}
    else if(++tries>=200)clearInterval(iv);
  },50);
  function init(T){
    var DEF={};try{DEF=JSON.parse(JSON.stringify(T.options.theme||{}))}catch(e){}
    var lastTap=0,globalTheme="",lastFetch=0;
    function effective(){
      var s="";try{s=localStorage.getItem(KEY)||""}catch(e){}
      if(THEMES[s])return s;
      if(globalTheme&&THEMES[globalTheme])return globalTheme;
      return "";
    }
    function themeObj(n){var t=THEMES[n];if(!t)return DEF;var c={},k;for(k in t)c[k]=t[k];
      if(c.selectionBackground&&c.selectionBackground.length===7)c.selectionBackground+="80";/*Windows Terminal draws selection at 50% alpha; the ports assume it*/
      return c}
    function apply(n){var o=themeObj(n);
      try{T.options.theme=o}catch(e){if(T.setOption)T.setOption("theme",o)}
      var bg=o.background||(DEF.background||"#2b2b2b");
      document.body.style.background=bg;/*safe-area edges around the xterm box*/
      var m=document.querySelector('meta[name="theme-color"]');
      if(m)m.setAttribute("content",bg);/*PWA status bar follows the terminal*/
      var s=document.getElementById("ccthemesel");
      if(s){var st="";try{st=localStorage.getItem(KEY)||""}catch(e){}s.value=THEMES[st]?st:"Default";}
    }
    function save(n){try{THEMES[n]?localStorage.setItem(KEY,n):localStorage.removeItem(KEY)}catch(e){}}
    function fetchGlobal(cb){
      lastFetch=Date.now();
      try{
        fetch('/settings/term-theme.json').then(function(r){
          if(!r.ok)return;
          return r.json();
        }).then(function(d){
          if(d&&typeof d.name==="string"){
            var prev=globalTheme;
            globalTheme=THEMES[d.name]?d.name:"";
            if(prev!==globalTheme&&cb)cb();
          }
        }).catch(function(){});
      }catch(e){}
    }
    if(q)save(q);/*unknown names (incl. "default") clear back to stock*/
    apply(effective());
    fetchGlobal(function(){
      var st="";try{st=localStorage.getItem(KEY)||""}catch(e){}
      if(!THEMES[st])apply(effective());
    });
    window.cctheme=function(n){lastTap=Date.now();save(n);apply(effective());return Object.keys(THEMES)};
    setInterval(function(){try{
      if(Date.now()-lastFetch>=30000){
        fetchGlobal(function(){
          var st="";try{st=localStorage.getItem(KEY)||""}catch(e){}
          if(!THEMES[st])apply(effective());
        });
      }
      if(Date.now()-lastTap>2000){
        var eff=effective(),want=themeObj(eff),cur=T.options.theme||{};
        if(cur.background!==want.background||cur.foreground!==want.foreground)apply(eff);
      }
    }catch(e){}},1000);
    var bar=document.getElementById("cckb");
    if(bar){
      var sel=document.createElement("select");sel.id="ccthemesel";sel.title="terminal theme";
      var opt0=document.createElement("option");opt0.value="Default";opt0.textContent="Auto (global)";sel.appendChild(opt0);
      Object.keys(THEMES).forEach(function(n){
        var o=document.createElement("option");o.value=n;o.textContent=n;sel.appendChild(o)});
      var stored="";try{stored=localStorage.getItem(KEY)||""}catch(e){}
      sel.value=THEMES[stored]?stored:"Default";
      sel.addEventListener("change",function(){lastTap=Date.now();save(sel.value);apply(effective())});
      bar.appendChild(sel);
    }
  }
})()</script>
