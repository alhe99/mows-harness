<style id="cckb-css">

background:#161b22;border-top:1px solid #30363d;padding:5px 6px calc(5px + env(safe-area-inset-bottom));
gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch}
#cckb button{flex:0 0 auto;min-width:44px;height:36px;background:#21262d;color:#e6edf3;
border:1px solid #30363d;border-radius:6px;font:13px ui-monospace,monospace;padding:0 10px}
#cckb button:active{background:#238636}
@media(pointer:coarse){#cckb{display:flex}#terminal-container{height:calc(100% - 46px)}}
</style>
