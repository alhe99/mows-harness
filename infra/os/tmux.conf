unbind C-b
set -g prefix C-q
bind C-q send-prefix

# Switch panes with Alt+Arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D


# Enable mouse support for pane selection
set -g mouse on

# Increase history for long agent outputs
set -g history-limit 50000

# Session name in the client's title bar. The /term web terminal propagates this to the
# browser-tab title (ttyd's xterm client wires OSC titles to document.title), so five
# session windows read "web-56b3bc56 · lending", "cc-work-api-2 · api", ... instead of
# five identical tabs. SSH terminals get the same title for free.
set -g set-titles on
set -g set-titles-string '#S · #{b:pane_current_path}'

# Repaint the client after it attaches or resizes.
#
# The /term web terminal drops its websocket whenever the phone's screen locks; ttyd then
# KILLS the child process, so returning always means a fresh page, a fresh web-term.sh and a
# fresh `tmux attach -d`. That reattach redraw races the client's size settling (PWA geometry,
# the key bar, fonts loading — and `attach -d` resizes the window to the arriving client), and
# what lands on screen is a mangled screenful: one line tiled down the viewport, or fragments
# of three different lines fused into each row. tmux's own pane content is CORRECT throughout
# — only the client's screen is out of sync, which is why tapping the screen fixed it: any
# input made the application repaint.
#
# refresh-client is that tap, from the server side, and it needs no help from the browser.
# Verified on a scratch server by corrupting a client's screen behind tmux's back (writing
# straight to its pty): refresh-client repainted the real pane content over the garbage.
#
# The 2s delay is the point — firing immediately would just race the resize again. run-shell
# -b -d keeps it off the server's main loop. Redundant refreshes are harmless (~300 bytes).
#
# ponytail: one delayed repaint on the two hooks that mean "the client just changed", rather
# than chasing which layer desynced. If 2s ever proves too early, raise it — don't add logic.
set-hook -g client-attached 'run-shell -b -d 2 "tmux refresh-client -t \"#{client_name}\" 2>/dev/null || true"'
set-hook -g client-resized  'run-shell -b -d 2 "tmux refresh-client -t \"#{client_name}\" 2>/dev/null || true"'
