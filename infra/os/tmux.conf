unbind C-b
set -g prefix C-q
bind C-q send-prefix

# Switch panes with Alt+Arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D


# Enable mouse support for pane selection
set -g mouse on

# Increase history for long agent outputs
set -g history-limit 50000

# Session name in the client's title bar. The /term web terminal propagates this to the
# browser-tab title (ttyd's xterm client wires OSC titles to document.title), so five
# session windows read "web-56b3bc56 · lending", "cc-work-api-2 · api", ... instead of
# five identical tabs. SSH terminals get the same title for free.
set -g set-titles on
set -g set-titles-string '#S · #{b:pane_current_path}'

# Repaint after a client attaches or resizes — and make the APPLICATION redraw too.
#
# The /term web terminal drops its websocket whenever the phone's screen locks; ttyd then
# KILLS the child process, so returning always means a fresh page and a fresh `tmux attach -d`
# while the page's size churns (fit, fonts, key bar). Claude-style TUIs re-render mid-storm
# and tmux's pane model is left holding fused/tiled garbage; the app then idles, so nothing
# ever overwrites it. Tapping the phone screen fixed it only because the keyboard opening
# changed the height -> real SIGWINCH -> full app re-layout.
#
# refresh-client alone was proven insufficient on 2026-08-23: the hook fired (verified live
# with a logging hook) and repainted the client faithfully — faithfully showing the garbage,
# because the garbage was IN the pane model. The fix that matches the mechanism is a real
# size change: shrink the window a row, then unset window-size, which both restores
# client-tracking AND snaps the dims back. Two genuine SIGWINCHes -> the app fully re-renders.
# The 0.5s between them stops a coalescing app from netting the pair to zero (verified: a
# responsive pane process receives 2, dims and size-mode restored exactly).
#
# The 2s delay lets the reattach resize storm settle first. run-shell -b keeps it off the
# server's main loop. A desktop SSH attach gets one instant blink — the cost of correctness.
#
# ponytail: no per-client-type logic, no debounce machinery — redundant wiggles are idempotent
# (each pair ends restored). If the storm ever outlives 2s, raise the delay, don't add logic.
set-hook -g client-attached 'run-shell -b -d 2 "tmux refresh-client -t \"#{client_name}\" 2>/dev/null; tmux resize-window -t \"#{client_session}\" -U 1 2>/dev/null; sleep 0.5; tmux set -w -t \"#{client_session}\" -u window-size 2>/dev/null || true"'
set-hook -g client-resized  'run-shell -b -d 2 "tmux refresh-client -t \"#{client_name}\" 2>/dev/null; tmux resize-window -t \"#{client_session}\" -U 1 2>/dev/null; sleep 0.5; tmux set -w -t \"#{client_session}\" -u window-size 2>/dev/null || true"'
