unbind C-b
set -g prefix C-q
bind C-q send-prefix

# Switch panes with Alt+Arrow (no prefix needed)
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D


# Enable mouse support for pane selection
set -g mouse on

# Increase history for long agent outputs
set -g history-limit 50000

# Session name in the client's title bar. The /term web terminal propagates this to the
# browser-tab title (ttyd's xterm client wires OSC titles to document.title), so five
# session windows read "web-56b3bc56 · lending", "cc-work-api-2 · api", ... instead of
# five identical tabs. SSH terminals get the same title for free. A user label set
# via `ccname` (tmux @label, also editable from the dashboard ✎) replaces #S.
set -g set-titles on
set -g set-titles-string '#{?@label,#{@label},#S} · #{b:pane_current_path}'

# Repaint after a client attaches or resizes — and on attach, make the APPLICATION redraw.
#
# The /term web terminal drops its websocket whenever the phone's screen locks; ttyd then
# KILLS the child process, so returning always means a fresh page and a fresh `tmux attach -d`
# while the page's size churns. TUIs re-render mid-storm and tmux's pane model is left holding
# tiled/fused garbage; the app then idles, so nothing overwrites it. refresh-client alone was
# proven insufficient (hook verified firing during a live repro, screen stayed garbled — the
# garbage was IN the model), and a same-size SIGWINCH is ignored, so the attach payload also
# runs a real size wiggle. Details, and why resized does NOT wiggle (it made TUIs shed a trail
# of orphan frames on every keyboard open/close), live in webterm-settle.sh alongside
# web-term.sh — the hook only says WHEN, the script says WHAT and WHY.
# The 2s delay lets the reattach storm settle; run-shell -b keeps it off the server's loop.
set-hook -g client-attached 'run-shell -b -d 2 "/opt/claude-dashboard/webterm-settle.sh attached \"#{client_name}\" \"#{client_session}\" #{client_width}x#{client_height}"'
set-hook -g client-resized  'run-shell -b -d 2 "/opt/claude-dashboard/webterm-settle.sh resized \"#{client_name}\" \"#{client_session}\" #{client_width}x#{client_height}"'
