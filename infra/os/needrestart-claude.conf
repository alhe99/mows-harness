# /etc/needrestart/conf.d/claude.conf — keep needrestart's hands off the tmux server.
#
# needrestart (run by apt via /etc/apt/apt.conf.d/99needrestart after every
# unattended-upgrade) restarts any systemd unit whose processes still map a library that
# was just replaced. Every Claude Code session is a process inside claude-tmux.service, and
# sessions load glibc, openssl, libcurl, ... — so on 2026-08-25 a routine libcurl security
# update "restarted" the terminal fleet and killed every live session. A restart of this
# unit is never a fix for anything; the sessions pick up new libraries the next time they
# are started, like any interactive shell.
#
# Install:  sudo install -m644 infra/os/needrestart-claude.conf /etc/needrestart/conf.d/claude.conf
# Verify:   sudo needrestart -r l   (lists what WOULD restart; claude-tmux must not appear)
$nrconf{override_rc}{qr(^claude-tmux\.service$)} = 0;
