name: e2e-infra
# Stands the whole layer-3 cockpit up in a container -- Caddy, oauth2-proxy, ttyd and the
# dashboard -- and proves the auth chain end to end, plus the /stream contract.
#
# Deliberately NOT part of preflight.sh. preflight is the fast, offline, always-run pre-commit
# gate; a five-minute job needing Docker and network in there gets skipped on a laptop and then
# disabled, and a check that silently skips is the exact disease this job exists to treat -- two
# of the assertions it runs were born red and survived 57 commits because nothing ever ran them.
#
# Its own workflow rather than a job inside ci.yml so it can use GitHub's native path filter:
# per-job filtering needs a third-party action, and this repo should not take on a new
# supply-chain dependency to answer a question `on.push.paths` already answers. The path list is
# duplicated across push/pull_request because GitHub Actions does not support YAML anchors --
# keep the two copies in step.
on:
  push:
    paths:
      - 'infra/**'
      - 'install.sh'
      - 'scripts/e2e-infra'
      - 'scripts/e2e-infra.sh'
      - 'scripts/stream-*.mjs'
      - '.github/workflows/e2e-infra.yml'
  pull_request:
    paths:
      - 'infra/**'
      - 'install.sh'
      - 'scripts/e2e-infra'
      - 'scripts/e2e-infra.sh'
      - 'scripts/stream-*.mjs'
      - '.github/workflows/e2e-infra.yml'
  # The suite downloads the LATEST oauth2-proxy release and the Caddy apt repo on every run, so
  # it can break with nobody having touched this repo. Nightly turns that from a surprise during
  # the next infra change into a dated, attributable failure.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
jobs:
  e2e-infra:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      # scripts/e2e-infra does its own `docker run` and installs everything it needs inside the
      # container, so there is nothing to set up on the runner beyond Docker, preinstalled on
      # ubuntu-24.04. Exits non-zero on any failed assertion (`[ "$FAIL" -eq 0 ]` at its tail),
      # which is only a usable gate because the suite is now fully green -- 90 passed, 0 failed
      # (89 here unless MOWS_HOST is set; see below).
      #
      # MOWS_HOST is the one assertion in this suite that cannot run inside the container: HTTP/2
      # needs a live TLS endpoint, and this container has neither DNS for one nor a certificate.
      # The spec singles that regression out as SILENT (over HTTP/1.1 the browser caps SSE at six
      # connections per origin ACROSS ALL TABS; the seventh tab simply never receives a token and
      # looks like a hung agent), and until now its only execution in this branch's life was one
      # maintainer typing the variable by hand -- a gate against a silent risk, itself guarded by
      # somebody remembering (final review, M5).
      #
      # `vars.MOWS_HOST` is a repository VARIABLE, not a file: preflight's forbidden-string gate
      # treats a real domain as a leaked identifier, so the hostname cannot live in this tree and
      # the suite reads it from the environment for exactly that reason. Unset -- which is every
      # fork, every clone and this repo until somebody sets it -- expands to the empty string and
      # the assertion SKIPs loudly, precisely as it does today. Nothing about that tension is
      # solved by this line; it is documented in docs/architecture.md, and this is the hook.
      - run: ./scripts/e2e-infra
        env:
          MOWS_HOST: ${{ vars.MOWS_HOST }}
