<!doctype html>
<!-- mac-frame.html — wraps a screenshot in macOS-style window chrome for the README.
     Open as file://…/mac-frame.html?img=<file>.png&title=<bar text>, then take an
     element screenshot of #wrap with omitBackground:true (playwright) so the drop
     shadow keeps its alpha and the frame sits cleanly on GitHub's light AND dark
     themes. Used after stage-demo.sh has produced the raw captures — the chrome is
     pure CSS, so re-framing after a re-shoot is one headless pass, no image tools. -->
<meta charset="utf-8">
<style>
  html, body { margin: 0; background: transparent; }
  #wrap { display: inline-block; padding: 28px; }           /* room for the shadow */
  #win  { border-radius: 12px; overflow: hidden; background: #09090b;
          border: 1px solid rgba(63,63,70,.9);
          box-shadow: 0 18px 50px rgba(0,0,0,.55); }
  #bar  { height: 36px; display: flex; align-items: center; padding: 0 14px;
          background: #18181b; border-bottom: 1px solid rgba(39,39,42,.8);
          position: relative; }
  .dot  { width: 12px; height: 12px; border-radius: 50%; margin-right: 8px; }
  #title{ position: absolute; left: 0; right: 0; text-align: center; color: #71717b;
          font: 500 13px -apple-system, system-ui, sans-serif; pointer-events: none; }
  img   { display: block; max-width: none; }
</style>
<div id="wrap"><div id="win">
  <div id="bar">
    <span class="dot" style="background:#ff5f57"></span>
    <span class="dot" style="background:#febc2e"></span>
    <span class="dot" style="background:#28c840"></span>
    <span id="title"></span>
  </div>
  <img id="shot" alt="">
</div></div>
<script>
  const q = new URLSearchParams(location.search);
  document.getElementById('shot').src = q.get('img') || '';
  document.getElementById('title').textContent = q.get('title') || 'mows control';
  if (q.get('mode') === 'phone') {   // phone captures: bezel-ish rounded frame, no title bar
    document.getElementById('bar').remove();
    const w = document.getElementById('win');
    w.style.borderRadius = '32px';
    w.style.border = '6px solid #27272a';
  }
</script>
